workflows:
  android-release:
    name: YOU - Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Scaffold Android platform
        script: |
          set -e
          TEMP_DIR="$(mktemp -d)"
          echo "Temp dir: $TEMP_DIR"
          cd "$TEMP_DIR"
          flutter create --no-pub --org com.youapp --project-name you .
          mkdir -p "$CM_BUILD_DIR/android"
          cp -R "$TEMP_DIR/android/." "$CM_BUILD_DIR/android/"
          cd "$CM_BUILD_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i.bak 's/android:label="you"/android:label="YOU"/g' "$MANIFEST"

            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              awk '{
                if (/<application/ && !done) {
                  print "    <uses-permission android:name=\"android.permission.INTERNET\"/>"
                  print "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>"
                  done = 1
                }
                print
              }' "$MANIFEST" > "$MANIFEST.tmp"
              mv "$MANIFEST.tmp" "$MANIFEST"
              echo "INTERNET permission added to AndroidManifest.xml"
            fi

            echo "--- Final AndroidManifest.xml ---"
            cat "$MANIFEST"
          fi

          echo "Android platform scaffolded."

      - name: Flutter pub get
        script: flutter pub get

      - name: Generate localizations
        script: flutter gen-l10n

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/*.apk